<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Roadster — Harbor City</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      /* physics readout: top left, quiet */
      #hud {
        position: fixed;
        left: calc(12px + env(safe-area-inset-left));
        top: calc(10px + env(safe-area-inset-top));
        right: 64px;
        color: #5c5c5c;
        font:
          11px/1.5 ui-monospace,
          Menlo,
          monospace;
        pointer-events: none;
        white-space: pre-wrap;
      }
      /* key hints: bottom right, quieter still */
      #keys {
        position: fixed;
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(10px + env(safe-area-inset-bottom));
        left: 12px;
        text-align: right;
        color: #3d3d3d;
        font:
          10.5px/1.5 ui-monospace,
          Menlo,
          monospace;
        pointer-events: none;
        white-space: pre-wrap;
      }
      .touch #keys {
        display: none;
      }
      /* touch pad (touch devices only): left thumb steers, right thumb pedals + thrusters */
      #pad {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      .touch #pad {
        display: block;
      }
      #pad .grp {
        position: absolute;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        pointer-events: none;
      }
      #pad button {
        pointer-events: auto;
        touch-action: none;
        display: grid;
        place-items: center;
        padding: 0;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        border: 1px solid #ffffff12;
        background: #ffffff08;
        color: #707070;
        -webkit-tap-highlight-color: transparent;
      }
      #pad button svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #pad button.on {
        background: #ff3b3b26;
        border-color: #ff6b6b66;
        color: #ddd;
      }
      #pad .steer button {
        width: 68px;
        height: 60px;
      }
      #pad .pedals .gas {
        width: 60px;
        height: 92px;
        border-radius: 16px;
      }
      #pad .pedals .brake {
        width: 60px;
        height: 64px;
        border-radius: 16px;
      }
      #pad .jets button {
        width: 46px;
        height: 46px;
        border-radius: 50%;
      }
      #pad .jets button svg {
        width: 20px;
        height: 20px;
      }
      #pad .misc button {
        width: 38px;
        height: 38px;
        border-radius: 50%;
      }
      #pad .misc button svg {
        width: 17px;
        height: 17px;
      }
      #pad .steer {
        left: calc(16px + env(safe-area-inset-left));
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
      #pad .pedals {
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
      #pad .jets {
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(126px + env(safe-area-inset-bottom));
      }
      #pad .misc {
        right: calc(10px + env(safe-area-inset-right));
        top: calc(8px + env(safe-area-inset-top));
        flex-direction: column;
        align-items: flex-end;
      }
      #pad .more {
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #pad .misc.open .more {
        display: flex;
      }
      /* landscape phones: thrusters go beside the pedals, not above */
      @media (orientation: landscape) and (max-height: 500px) {
        #pad .jets {
          bottom: calc(18px + env(safe-area-inset-bottom));
          right: calc(156px + env(safe-area-inset-right));
          flex-direction: column;
        }
      }
      #dbg {
        position: fixed;
        right: calc(12px + env(safe-area-inset-right));
        top: calc(10px + env(safe-area-inset-top));
        max-width: min(420px, calc(100vw - 24px));
        background: #0b0b0bdd;
        border: 1px solid #333;
        border-radius: 8px;
        color: #ccc;
        font:
          11px/1.5 ui-monospace,
          Menlo,
          monospace;
        padding: 10px 12px;
        display: none;
        z-index: 10;
        -webkit-user-select: text;
        user-select: text;
      }
      #dbg.show {
        display: block;
      }
      .touch #dbg {
        top: auto;
        bottom: calc(150px + env(safe-area-inset-bottom));
        right: auto;
        left: calc(12px + env(safe-area-inset-left));
      }
      #dbg pre {
        margin: 0 0 8px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #dbg button {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 5px;
        padding: 4px 10px;
        margin-right: 6px;
        cursor: pointer;
      }
      /* ? about link + popup */
      #about-btn {
        position: fixed;
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(10px + env(safe-area-inset-bottom));
        color: #4a4a4a;

          10.5px/1.5 ui-monospace,
          Menlo,
          monospace;
        background: none;
        border: 0;
        padding: 0;
        margin: 0;

        display: block;
        cursor: pointer;
        z-index: 5;

      #about-btn:hover {
        color: #888;
      }
      #keys {
        right: calc(40px + env(safe-area-inset-right));
      }
      .touch #about-btn {
        bottom: auto;
        top: calc(17px + env(safe-area-inset-top));
        right: calc(58px + env(safe-area-inset-right));
      }
      #about {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        place-items: center;
        background: #000a;
        padding: 16px;
      }
      #about.show {
        display: grid;
      }
      #about .card {
        max-width: 440px;
        width: 100%;
        max-height: calc(100dvh - 32px);
        overflow: auto;
        background: #0c0c0c;
        border: 1px solid #262626;
        border-radius: 10px;
        padding: 18px 20px;
        color: #9a9a9a;
        font:
          12px/1.65 ui-monospace,
          Menlo,
          monospace;
        -webkit-user-select: text;
        user-select: text;
      }
      #about h2 {
        margin: 0 0 10px;
        font:
          600 12px ui-monospace,
          Menlo,
          monospace;
        color: #ddd;
        letter-spacing: 0.02em;
      }
      #about h3 {
        margin: 14px 0 4px;
        font:
          600 11px ui-monospace,
          Menlo,
          monospace;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #about p,
      #about ul {
        margin: 0;
      }
      #about ul {
        padding-left: 16px;
      }
      #about li {
        margin: 2px 0;
      }
      #about a {
        color: #ccc;
        text-decoration: none;
        border-bottom: 1px solid #444;
      }
      #about a:hover {
        color: #fff;
        border-color: #888;
      }
      #about .x {
        float: right;
        background: none;
        border: 0;
        color: #666;
        font:
          14px ui-monospace,
          Menlo,
          monospace;
        cursor: pointer;
        padding: 0 0 0 10px;
      }
      #about .x:hover {
        color: #ccc;
      }
      #boot {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 100;
        display: grid;
        place-items: center;
        transition: opacity 0.7s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #3a3a3a;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #hud {
        left: max(24px, env(safe-area-inset-left));
        top: max(24px, env(safe-area-inset-top));
        right: auto;
        color: #f6f3eb;
        white-space: normal;
        text-shadow: 0 1px 6px #13212688;
      }
      .hud-label {
        display: flex;
        gap: 24px;
        align-items: center;
        font:
          600 11px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.16em;
      }
      #drive-status {
        font-size: 9px;
        letter-spacing: 0.12em;
        color: #e0ede6;
      }
      .speed {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 6px;
      }
      .speed strong {
        font:
          300 58px/0.98 system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.045em;
      }
      .speed span {
        font:
          500 9px system-ui,
          sans-serif;
        letter-spacing: 0.12em;
      }
      #keys {
        left: max(24px, env(safe-area-inset-left));
        right: 64px;
        bottom: max(24px, env(safe-area-inset-bottom));
        text-align: left;
        display: flex;
        gap: 24px;
        color: #fff;
        font:
          11px/1.5 system-ui,
          sans-serif;
        text-shadow: 0 1px 5px #132126;
      }
      #about-btn {
        right: max(24px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        color: #fff;
        border: 1px solid #ffffff66;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        font:
          12px system-ui,
          sans-serif;
        background: #22303355;
      }
      #about-btn:active,
      #pad button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }
      #pad button {
        color: #f3f3e9;
        background: #23313988;
        border-color: #ffffff55;
      }
      #pad button.on {
        background: #c6ddd8aa;
        color: #172e30;
        border-color: #fff;
      }
      #about .card {
        background: #172426;
        border-color: #ffffff22;
        color: #c3cfce;
        border-radius: 16px;
        font-family: system-ui, sans-serif;
      }
      #about h2 {
        font:
          500 18px system-ui,
          sans-serif;
      }
      #about h3 {
        color: #8fa7a5;
      }
      #boot {
        background: #b9cbd0;
      }
      #boot i {
        border-top-color: #435d62;
      }
      @media (max-width: 600px) {
        #hud {
          left: 16px;
          top: 16px;
        }
        .speed strong {
          font-size: 44px;
        }
        .hud-label {
          gap: 12px;
        }
        #keys {
          gap: 12px;
          font-size: 10px;
          left: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
      }
      .energy {
        width: 140px;
        margin-top: 12px;
      }
      .energy-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font:
          500 8px/1.5 system-ui,
          sans-serif;
        letter-spacing: 0.12em;
      }
      #charge-meter {
        height: 3px;
        overflow: hidden;
        background: #17343755;
        margin-top: 5px;
        border-radius: 2px;
      }
      #charge-fill {
        display: block;
        height: 100%;
        width: 100%;
        background: #e0fff4;
        transform-origin: left;
      }
      #hud[data-low="true"] #charge-fill {
        background: #ffc08c;
      }
      #hud[data-low="true"] .energy-label {
        color: #ffe1c3;
      }
      .launch-readout {
        margin-top: 10px;
        font:
          500 9px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 12px 0;
        font-size: 13px;
        color: #eef5f0;
      }
      .setting input {
        width: 20px;
        height: 20px;
        accent-color: #b5dfcf;
        cursor: pointer;
      }
      .energy {
        width: 160px;
      }
      .charge-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 28px;
      }
      #charge-meter {
        flex: 1;
        margin-top: 0;
      }
      .infinite-control {
        position: relative;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        pointer-events: auto;
        cursor: pointer;
      }
      .infinite-control input {
        appearance: none;
        -webkit-appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        border: 1px solid #ffffff66;
        border-radius: 7px;
        background: #20383a55;
        cursor: pointer;
      }
      .infinite-control input:checked {
        background: #d8f2e8;
        border-color: #d8f2e8;
      }
      .infinite-control span {
        position: relative;
        color: #fff;
        font:
          20px/1 system-ui,
          sans-serif;
        pointer-events: none;
      }
      .infinite-control input:checked + span {
        color: #19312f;
      }
      .infinite-control input:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      #about .card {
        max-width: 340px;
      }
      #about p + p {
        margin-top: 10px;
      }
      #about .credits {
        margin-top: 20px;
        font-size: 11px;
        color: #a6bdb7;
      }
      #scene-tabs { position:fixed;top:calc(20px + env(safe-area-inset-top));right:calc(20px + env(safe-area-inset-right));display:flex;gap:4px;padding:4px;border:1px solid #ffffff26;border-radius:14px;background:#142a29b8;backdrop-filter:blur(14px);z-index:20; }
      #scene-tabs button { border:0;border-radius:10px;padding:11px 14px;color:#d6e2dc;background:transparent;font:500 12px system-ui;cursor:pointer; }
      #scene-tabs button[aria-pressed="true"] { background:#d8f2e8;color:#19312f; }
      #scene-tabs button:focus-visible { outline:2px solid white;outline-offset:2px; }
      #scene-tabs button:disabled { cursor:wait; }
      #scene-loading { position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;gap:12px;background:#102323cc;backdrop-filter:blur(8px);color:#edf8f1;font:500 14px system-ui; }
      #scene-loading[hidden] { display:none; }
      .scene-spinner { width:20px;height:20px;border:2px solid #ffffff30;border-top-color:#d8f2e8;border-radius:50%;animation:scene-spin .8s linear infinite; }
      @keyframes scene-spin { to { transform:rotate(360deg); } }
      @media(max-width:540px) { #scene-tabs { top:calc(14px + env(safe-area-inset-top));right:12px; } #scene-tabs button { padding:10px 9px;font-size:11px; } }
      @media(prefers-reduced-motion:reduce) { .scene-spinner { animation:none;border-color:#d8f2e8; } }
    </style>
    <link
      rel="preload"
      href="/models/roadster.glb"
      as="fetch"
      crossorigin="anonymous"
    />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <div id="boot"><i></i></div>
    <nav id="scene-tabs" aria-label="Scene">
      <button type="button" data-scene="city" aria-pressed="true">City & forest</button>
      <button type="button" data-scene="ramp" aria-pressed="false">Original ramp</button>
    </nav>
    <div id="scene-loading" hidden role="status" aria-live="polite"><span class="scene-spinner"></span><span id="scene-loading-text">Loading scene…</span></div>
    <button id="about-btn" aria-label="Controls and credits">?</button>
    <div
      id="about"
      role="dialog"
      aria-modal="true"
      aria-label="Controls and credits"
    >
      <div class="card">
        <button class="x" aria-label="Close">×</button>
        <h2>Roadster</h2>

        <p>WASD drive. B boost. E fly / land.</p>
        <p>
          Shift + WASD fires jets. Q / Z changes height. Space descends. N
          changes sunlight.
        </p>
        <p class="credits">
          <a
            href="https://x.com/ableezz"
            target="_blank"
            rel="noopener noreferrer"
            >Ableex · @ableezz</a
          >
          · GPT-6
        </p>
      </div>
    </div>
    <script>
      (() => {
        const box = document.getElementById("about"),
          btn = document.getElementById("about-btn");
        const open = (v) => {
          box.classList.toggle("show", v);
          if (v) dispatchEvent(new Event("blur"));
        };
        btn.addEventListener("click", () => open(true));
        box.addEventListener("click", (e) => {
          if (e.target === box || e.target.closest(".x")) open(false);
        });
        addEventListener(
          "keydown",
          (e) => {
            if (e.key === "Escape") open(false);
          },
          true,
        );
        // keep driving keys from leaking into the sim while the popup is open
        for (const t of ["keydown", "keyup"])
          addEventListener(
            t,
            (e) => {
              if (box.classList.contains("show") && e.key !== "Escape")
                e.stopImmediatePropagation();
            },
            true,
          );
      })();
    </script>
    <script type="module" src="/assets/main.js?v=flip2"></script>
  </body>
